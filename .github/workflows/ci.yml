name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        omnigent: ["omnigent==0.4.0", "omnigent"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" "${{ matrix.omnigent }}" build
      - name: Run tests
        run: pytest -v
      - name: Build and verify wheel installation
        run: |
          python -m build
          python scripts/check_dist.py dist
          pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/scripts/check_install.py"
