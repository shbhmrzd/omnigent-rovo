[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-rovo"
version = "0.1.0"
description = "Rovo Dev harness plugin for Omnigent — drives Atlassian Rovo Dev via its ACP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Shubham Raizada" },
]
keywords = ["omnigent", "rovo", "harness", "acp", "atlassian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "omnigent>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/shbhmrzd/omnigent-rovo"
Repository = "https://github.com/shbhmrzd/omnigent-rovo"

[project.entry-points."omnigent.community.harness"]
rovo = "omnigent.community.harness.rovo.plugin:get_contribution"

# -- tool config -----------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["omnigent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
